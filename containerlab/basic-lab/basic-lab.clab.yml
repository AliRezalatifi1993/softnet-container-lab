name: basic-lab

topology:
  defaults:
    kind: linux
    image: clab-softnet-basic:latest

  nodes:
    node1:
      binds:
        - ./bin/entrypoint.sh:/entrypoint.sh:ro
        - configs/node1.cfg:/etc/nodes/node1.cfg:ro
      exec:
        - bash /entrypoint.sh

    node2:
      binds:
        - ./bin/entrypoint.sh:/entrypoint.sh:ro
        - configs/node2.cfg:/etc/nodes/node2.cfg:ro
      exec:
        - bash /entrypoint.sh

  links:
    - endpoints:
        - node1:eth1
        - node2:eth1
